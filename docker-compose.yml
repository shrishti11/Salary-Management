services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/salary_management?schema=public
      # Required (min 32 chars): no default, so a deployment can never run with a public secret.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars), e.g. JWT_SECRET=$(openssl rand -hex 32) docker compose up --build}
      JWT_EXPIRES_IN: 1d
      COOKIE_NAME: session
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # SSR server calls the API server-side over the compose network.
        VITE_API_URL: http://backend:3001
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
